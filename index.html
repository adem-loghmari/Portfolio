<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var mode = "light";
        try {
          mode = localStorage.getItem("mui-mode") || "light";
        } catch (e) {}
        if (mode === "system") {
          mode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.classList.add(mode === "dark" ? "dark" : "light");
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Adam Hmida Loghmari — Full-Stack Developer specializing in React, Next.js, Node.js, and Laravel. Open to remote work and relocation." />
    <meta name="theme-color" content="#1565c0" />
    <title>Adam Hmida Loghmari — Full-Stack Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
